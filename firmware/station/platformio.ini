; ===================================================================================
; ARQUIVO: firmware/platformio.ini
; PROJETO: AgroSmart Precision System V5 (Firmware Industrial IoT)
; RESPONSÁVEL PELA ALTERAÇÃO: Revisão de Segurança (Fase 3 / Parte B — v5.24.0)
; DATA DE CRIACAO: 2026-02-10 08:00
; ULTIMA ATT: 2026-11-22 UTC
; VERSAO DO FIRMWARE: 5.24.0 (OTA Assinado ECDSA P-256 + Anti-Downgrade + Self-Test Robusto)
; HARDWARE ALVO: ESP32-WROOM-32 (DOIT DevKit V1 - 4MB Flash Dual-Bank OTA)
; ===================================================================================
; CHANGELOG v5.27.0:
; - Botoes fisicos: display (GPIO27: toque acende 5 min / apaga) e irrigacao (GPIO25:
;   segurar 1 s liga por btn_irrig_min, toque desliga). Botao travado >10 s e ignorado.
; - Eventos locais `loc-<boot>-<seq>-<on|off|disp>` no outbox duravel (recibo do servidor).
; - Display com padrao na NVS (sempre ligado/desligado) + "ligar por N min" pelo app.
; - Comando remoto com prefixo `loc-` e recusado (ninguem forja um aperto pela internet).
;
; CHANGELOG v5.25.2 (Fase 3C):
; - Comando/recibo sem device_id e recusado (teste T02 da Fase 3B).
; - Telemetria com sys.cmd_rejected (comandos recusados antes de gerar ACK).
; - Presenca sem IP local (minimizacao de dados).
;
; CHANGELOG v5.25.1 (Fase 3B, ajustes):
; - monitor_rts/monitor_dtr = 0: abrir/fechar o monitor serial nao reinicia a placa.
; - Presenca com `ota_pending_verify` + heartbeat imediato apos aprovar a particao.
; - Log [LATENCY] com o pino real; sem erro ruidoso de Preferences (active_cmd).
;
; CHANGELOG v5.25.0 (Fase 3B) - Seguranca fisica da valvula:
; - Valvula migrada para GPIO26 (GPIO2 e strapping: glitch no reset); GPIO2 = LED de status.
; - Guarda independente por esp_timer (prazo + heartbeat da task) fecha a valvula sozinha.
; - Modo seguro de energia apos 3 brownouts seguidos (ON bloqueado por 30 min).
; - Observacao pos-OTA de 90s continuos de MQTT antes de aprovar a particao.
; - Logs sem SSID completo e sem IP em nivel INFO.
;
; CHANGELOG v5.24.1:
; - Release de teste do fluxo OTA assinado (sem mudanca funcional).
;
; CHANGELOG v5.24.0:
; - OTA Assinado (ECDSA P-256 + SHA-256, contrato v1) validado antes e após download.
; - Anti-downgrade estrito (X.Y.Z) e bloqueio de versão problemática (`ota_badver`).
; - Self-test robusto: `verifyRollbackLater() = true`, prazo absoluto 10 min sem Wi-Fi
;   e motivo detalhado do rollback no NVS (`ota_rbwhy`).
; - Tabela `min_spiffs.csv` (slots OTA maiores) + CA bundle dedicado S3.
;
; CHANGELOG v5.23.2:
; - Autonomia Offline (Campo 15/30 min): substitui reboot de 180s por supervisor em
;   3 camadas (180s fecha válvula sem reboot, 5 min recicla Wi-Fi/TLS, 6h reboot final).
; - Cadência & Precisão: preserva intervalo restante de 15/30 min após reboot via
;   `g_lastTelemetryTs` (NVS) e ancora o ciclo antes da leitura (elimina drift +0,53s).
; - Fila WAL & RTC: corrige reconciliação que revertia `g_pendingSegWrite` após
;   rotação de segmento cheio e adiciona guarda de ano (2020..2037) em `getSystemTime`.
; - Mantém todas as blindagens v5.23.1 (Allowlist S3 OTA, sem redirects, NVS read-back
;   e tópico MQTT dedicado `.../ack_receipt`).
; ===================================================================================

[platformio]
default_envs = esp32doit-devkit-v1

[env:esp32doit-devkit-v1]
platform = espressif32 @ 6.9.0
board = esp32doit-devkit-v1
framework = arduino

; Esquema de particao Dual-Bank (Gaveta A = app0 | Gaveta B = app1) para OTA seguro
; troca de mapa só por gravação USB; NVS preservado em 0x9000
board_build.partitions = min_spiffs.csv

; Porta Serial para monitoramento de logs detalhados
upload_port = COM3
monitor_port = COM3

monitor_speed = 115200
; v5.25.1 (Fase 3B): nao mexer em DTR/RTS ao abrir/fechar o monitor (evita reset da placa,
; que durante a observacao pos-OTA provocaria rollback). O upload continua resetando sozinho.
monitor_rts = 0
monitor_dtr = 0
monitor_filters =
  time
  esp32_exception_decoder
  log2file

; Flags de compilacao e parametros operacionais default:
build_flags =
  -D FW_VERSION=\"5.27.0\"
  -D DEFAULT_TELEMETRY_INTERVAL_MS=30000
  -D ENABLE_OLED=1
  -D LOG_LEVEL=2
  -D TELEMETRY_SCHEMA_VERSION=2
  -D ENABLE_BATTERY_MONITOR=0

lib_deps =
  adafruit/Adafruit AHTX0 @ 2.0.5
  adafruit/Adafruit Unified Sensor @ 1.1.15
  adafruit/Adafruit BusIO @ 1.17.4
  adafruit/RTClib @ 2.1.4
  adafruit/Adafruit GFX Library @ 1.12.4
  adafruit/Adafruit SSD1306 @ 2.5.16
  knolleary/PubSubClient @ 2.8.0
  bblanchon/ArduinoJson @ 6.21.5
